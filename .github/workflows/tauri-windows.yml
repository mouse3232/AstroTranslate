name: Build Windows Portable EXE (Signed)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install Rust (MSVC toolchain)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4️⃣ Install frontend dependencies
      - name: Install npm dependencies
        run: npm install

      # 5️⃣ Build Tauri (portable EXE only)
      - name: Build Tauri app
        run: npx tauri build

      # 6️⃣ Decode code-signing certificate
      - name: Decode signing certificate
        run: |
          echo "${{ secrets.WINDOWS_CERT_BASE64 }}" | base64 --decode > cert.pfx

      # 7️⃣ Sign the EXE
      - name: Sign EXE
        run: |
          & "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f cert.pfx `
            /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            src-tauri/target/release/*.exe

      # 8️⃣ Upload signed portable EXE
      - name: Upload signed EXE
        uses: actions/upload-artifact@v4
        with:
          name: AstroTranslate-Windows-Portable
          path: src-tauri/target/release/*.exe
